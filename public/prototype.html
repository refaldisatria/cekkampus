const stf=S.role=="stf",it=stf?[["staff","Dasbor Staf","admin_panel_settings"]]:[["home","Status Ruangan","home"],["my","Pemesanan Saya","confirmation_number"]],v=S.view=="detail"?"home":S.view;
const body={home,detail,my,staff}[S.view]();
a.innerHTML=`<header class="fixed top-0 left-0 right-0 z-40 bg-surface shadow-sm" style="padding-top:env(safe-area-inset-top,0px)"><div class="h-16 max-w-[1440px] mx-auto px-margin-sm md:px-margin flex items-center justify-between"><div class="flex items-center gap-space-lg"><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-lg bg-primary-container text-white flex items-center justify-center">${I("menu_book","text-[20px]")}</div><span class="${HS} text-primary">StudyNook</span></div><nav class="hidden md:flex gap-1">${it.map(i=>`<button data-a="go" data-v="${i[0]}" class="px-space-md py-space-sm font-label-lg text-label-lg rounded-lg transition-colors ${v==i[0]?"bg-primary-container text-white shadow-sm":"text-on-surface-variant hover:bg-surface-container"}">${i[1]}</button>`).join("")}</nav></div><div class="flex items-center gap-space-md"><div class="hidden sm:block text-right"><div class="${LM}">${S.user.name}</div><div class="${LS} text-on-surface-variant font-normal">${stf?"Staf Gedung":"ID: "+S.user.id}</div></div><button data-a="logout" aria-label="Keluar" class="p-2 rounded-lg text-on-surface-variant hover:bg-surface-container">${I("logout","text-[20px]")}</button></div></div></header>
<main class="pt-16 min-h-screen pb-24 md:pb-0">${body}</main><footer class="bg-surface-container-low mt-space-xl hidden md:block"><div class="max-w-[1440px] mx-auto px-margin py-space-lg flex justify-between ${BS}"><span><b class="text-primary">StudyNook</b> — Sistem Reservasi Ruang Belajar Kampus</span><span>Prototipe percobaan · data contoh</span></div></footer>
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 flex bg-surface-container-lowest shadow-[0_-1px_8px_rgba(0,0,0,0.08)] px-2 pt-1.5" style="padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))">${it.concat([["logout","Keluar","person"]]).map(i=>`<button data-a="${i[0]=="logout"?"logout":"go"}" data-v="${i[0]}" class="flex-1 flex flex-col items-center gap-0.5 py-1.5 ${LS} ${v==i[0]?"text-primary":"text-on-surface-variant"}">${I(i[2],"text-[22px]")}${i[1]}</button>`).join("")}</nav>`;
document.querySelectorAll("[data-qr]").forEach(e=>{try{new QRCode(e,{text:qurl(S.bk.find(b=>b.id==e.dataset.qr)),width:240,height:240,colorDark:"#1e40af",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.L})}catch(x){e.innerHTML='<div class="w-60 text-center text-error">QR tidak dapat dimuat. Gunakan PIN kode alternatif.</div>'}});tick()}
function go(v){S.view=v;if(v=="home"){S.loading=true;render();setTimeout(()=>{S.loading=false;render()},450);return}render();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=="role"){const n=$("#nim");if(n)S.nim=n.value;S.role=v;render()}
else if(a=="login"){const n=$("#nim").value.trim();S.nim=n;S.user={id:n||"2401234567",name:S.role=="stf"?"Bambang S.":S.role=="dsn"?"Dr. Sari Wulandari":"Rafi Pratama"};go(S.role=="stf"?"staff":"home")}
else if(a=="go")go(v);else if(a=="logout"){S.view="login";S.user=null;render()}
else if(a=="cap"){S.cap=v||null;render()}else if(a=="fac"){S.fac=S.fac.includes(v)?S.fac.filter(x=>x!=v):[...S.fac,v];render()}
else if(a=="mode"){S.mode=v;render()}else if(a=="doorback"){try{history.replaceState(null,"",location.href.split("#")[0])}catch(e){}S.door=null;if(S.user)go("my");else{S.view="login";render()}}else if(a=="fdate"){S.fdate=v;render()}else if(a=="fslot"){S.fslot=v===""?null:+v;render()}else if(a=="floor"){S.floor=+v;render()}else if(a=="sel"){S.sel=+v;render()}
else if(a=="room"){S.room=+v;S.date=S.fdate;S.pick=(S.fslot!=null&&open(rooms[+v],S.fdate,S.fslot))?S.fslot:null;S.view="detail";render();scrollTo(0,0)}
else if(a=="date"){S.date=v;S.pick=null;render()}else if(a=="pick"){S.pick=+v;render()}
else if(a=="confirm"){const r=rooms[S.room];if(!open(r,S.date,S.pick)){toast("Slot ini sudah tidak tersedia. Pilih slot lain.");S.pick=null;render();return}
if(S.bk.some(b=>b.by=="me"&&live(b)&&b.date==S.date&&b.h==S.pick)){toast("Kamu sudah punya pemesanan di jam yang sama.");return}
S.bk.push({id:Date.now(),roomId:r.id,date:S.date,h:S.pick,status:"active",by:"me"});save();S.pick=null;toast("Pemesanan berhasil. Tunjukkan QR saat check-in.");go("my")}
else if(a=="scan"){const b=S.bk.find(x=>x.id==v);doorOpen({id:b.id,roomId:b.roomId,date:b.date,h:b.h},true)}
else if(a=="cancel"){S.bk.find(x=>x.id==v).status="cancelled";save();toast(S.role=="stf"?"Pemesanan dibatalkan oleh staf.":"Pemesanan dibatalkan.");render()}
else if(a=="maint"){const r=rooms[+v];r.m=!r.m;save();toast(r.m?r.name+" ditutup untuk maintenance.":r.name+" dibuka kembali.");render()}
else if(a=="manual"){const r=rooms[+$("#mr").value],h=+$("#mh").value;if(!open(r,today(),h)){toast("Slot tidak tersedia atau sudah lewat.");return}S.bk.push({id:Date.now(),roomId:r.id,date:today(),h,status:"checked",by:"staff",note:$("#mn").value||"Jadwal manual"});save();toast("Jadwal manual disimpan.");render()}});
setInterval(tick,1000);setInterval(()=>{if((S.view=="home"&&!S.loading)||S.view=="staff")render()},30000);
const d0=door(location.hash);if(d0)doorOpen(d0);else render();addEventListener("hashchange",()=>{const d=door(location.hash);if(d)doorOpen(d)});
</script>
